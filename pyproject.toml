[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec-nlp-graphrag"
version = "1.0.0"
description = "SOC assistant: cyber NER, STIX knowledge graph, HybridRAG with citations, agentic Cypher, RAG security audit and SIEM export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # data, NLP and retrieval
    "numpy", "pandas", "pyarrow", "scikit-learn", "joblib", "networkx",
    "torch", "transformers", "sentence-transformers", "faiss-cpu", "huggingface_hub",
    # local LLM fine-tuning / adapters
    "peft", "accelerate",
    # MVP
    "fastapi", "uvicorn", "pydantic", "httpx", "streamlit",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab", "ipykernel", "nbconvert", "matplotlib", "seaborn", "scipy", "datasets",
    "spacy", "gensim", "pyvis", "python-igraph", "leidenalg", "umap-learn", "torch-geometric",
    "evaluate", "rouge_score", "bert_score", "neo4j",
]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cybersec_nlp*", "backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]
