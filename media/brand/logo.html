<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vigie — logo</title>
<style>
  /* Locked brand system (media/MASTER_PROMPT.md): chrome 4-point star, cyan→blue heavy sans wordmark. */
  html, body { margin: 0; background: transparent; }
  body { font-family: "Poppins", "Montserrat", "Adwaita Sans", "Noto Sans", sans-serif; }
  .canvas { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .dark { background: #0C111C; }
  .dark::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 70% at 30% 50%, rgba(39,210,230,.16), transparent 70%),
                radial-gradient(ellipse 70% 60% at 85% 100%, rgba(11,35,71,.9), transparent 70%); }
  .lockup { position: relative; display: flex; align-items: center; gap: 20px; margin-left: -40px; }
  .word { font-weight: 800; font-size: 300px; line-height: 1; letter-spacing: -0.035em; padding-bottom: 18px;
    background: linear-gradient(95deg, #27D2E6 0%, #3FBDEB 45%, #5AA8F0 100%); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .tag { font-weight: 400; font-size: 46px; letter-spacing: .34em; text-transform: uppercase; color: #62B0BC;
    margin: 6px 0 0 10px; white-space: nowrap; }
  .icon-tile { position: relative; width: 1024px; height: 1024px; border-radius: 228px;
    background: radial-gradient(circle at 35% 30%, #13304F 0%, #0B1A2E 45%, #0C111C 100%);
    box-shadow: inset 0 0 0 3px rgba(39,210,230,.45), inset 0 0 120px rgba(39,210,230,.12);
    display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- iridescent teal chrome -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FFFF"/><stop offset=".22" stop-color="#8FEFF8"/>
      <stop offset=".45" stop-color="#27D2E6"/><stop offset=".68" stop-color="#3D5A8A"/>
      <stop offset=".86" stop-color="#9FE7F2"/><stop offset="1" stop-color="#E9FDFF"/>
    </linearGradient>
    <radialGradient id="spec" cx=".36" cy=".3" r=".38">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#27D2E6"/><stop offset=".55" stop-color="#62B0BC"/><stop offset="1" stop-color="#3D5A8A"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-170" y="-170" width="340" height="340">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 .15  0 0 0 0 .82  0 0 0 0 .9  0 0 0 .75 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the mark: a lookout ring open at the lower right, a beacon in the opening, the chrome star inside -->
    <symbol id="mark" viewBox="-170 -170 340 340" overflow="visible">
      <g filter="url(#glow)">
        <path d="M -88.4 88.4 A 125 125 0 1 1 88.4 88.4" fill="none" stroke="url(#ring)" stroke-width="10"
              stroke-linecap="round" transform="rotate(-20)"/>
        <circle cx="42.75" cy="117.46" r="9" fill="#27D2E6"/>
        <path d="M0,-100 C10,-14 14,-10 100,0 C14,10 10,14 0,100 C-10,14 -14,10 -100,0 C-14,-10 -10,-14 0,-100 Z" fill="url(#chrome)"/>
        <path d="M0,-100 C10,-14 14,-10 100,0 C14,10 10,14 0,100 C-10,14 -14,10 -100,0 C-14,-10 -10,-14 0,-100 Z" fill="url(#spec)"/>
        <path d="M0,-100 C10,-14 14,-10 100,0 C14,10 10,14 0,100 C-10,14 -14,10 -100,0 C-14,-10 -10,-14 0,-100 Z"
              fill="none" stroke="#DFFBFF" stroke-opacity=".75" stroke-width="2.4"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- #lockup : mark + wordmark (+ tagline) — transparent or .dark -->
<div id="lockup" class="canvas" style="width:1900px;height:640px;">
  <div class="lockup">
    <svg width="520" height="520"><use href="#mark"/></svg>
    <div>
      <div class="word">Vigie</div>
      <div class="tag">Assistant IA du SOC</div>
    </div>
  </div>
</div>

<!-- #icon : square app icon -->
<div id="icon" class="canvas" style="width:1024px;height:1024px;">
  <div class="icon-tile"><svg width="900" height="900"><use href="#mark"/></svg></div>
</div>

<!-- #mark-only : transparent mark -->
<div id="markonly" class="canvas" style="width:1024px;height:1024px;">
  <svg width="1100" height="1100"><use href="#mark"/></svg>
</div>

<script>
  // ?v=lockup|lockup-dark|icon|mark : show one variant only (used by render_logo.py)
  const v = new URLSearchParams(location.search).get("v") || "lockup";
  for (const id of ["lockup", "icon", "markonly"]) document.getElementById(id).style.display = "none";
  const node = document.getElementById({ "lockup": "lockup", "lockup-dark": "lockup", "icon": "icon", "mark": "markonly" }[v]);
  node.style.display = "flex";
  if (v === "lockup-dark") node.classList.add("dark");
</script>
</body>
</html>
